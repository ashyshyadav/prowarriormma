    <section class="contact-section" style="padding: 80px 0; background: #0a0a0a;">

            <div class="row">
                <div class="col-12">
                    <h2 class="contact-title" style="color: #f4c430; text-align: center; margin-bottom: 50px;">Enrollment Form</h2>
                </div>
                <div class="col-lg-8 mx-auto">
                    <form id="enrollmentForm" style="background: #181818; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">

                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group" style="margin-bottom: 25px;">
                                    <label style="color: #f4c430; font-weight: 600; margin-bottom: 10px;">Phone Number *</label>
                                    <input type="tel" name="phone" required class="form-control" style="background: #0a0a0a; border: 1px solid #2a2a2a; color: #fff; padding: 12px; border-radius: 5px;" placeholder="Enter your phone number">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group" style="margin-bottom: 25px;">
                                    <label style="color: #f4c430; font-weight: 600; margin-bottom: 10px;">Email</label>

                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group" style="margin-bottom: 25px;">
                                    <label style="color: #f4c430; font-weight: 600; margin-bottom: 10px;">Course to Enroll *</label>
                                    <select name="course" required class="form-control" style="background: #0a0a0a; border: 1px solid #2a2a2a; color: #fff; padding: 12px; border-radius: 5px;">
                                        <option value="">Select a course</option>
                                        <option value="MMA">MMA</option>
                                        <option value="HIIT Training">HIIT Training</option>
                                        <option value="Wrestling">Wrestling</option>
                                        <option value="Muay Thai">Muay Thai</option>
                                        <option value="Boxing">Boxing</option>
                                        <option value="Kickboxing">Kickboxing</option>
                                        <option value="Taekwondo">Taekwondo</option>
                                        <option value="BJJ">BJJ (Brazilian Jiu-Jitsu)</option>
                                        <option value="Blind Training">Blind Training</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12">
                                <div style="background: #0a0a0a; padding: 25px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #2a2a2a;">
                                    <h4 style="color: #f4c430; margin-bottom: 20px; font-size: 20px;">Quick Fitness Quiz</h4>
                                    <div id="quizQuestion" style="margin-bottom: 20px;">
                                        <p style="color: #fff; font-size: 16px; margin-bottom: 15px;"></p>
                                        <div id="quizOptions"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn" style="background: #f4c430; color: #000; padding: 15px 40px; border: none; border-radius: 5px; font-weight: 600; font-size: 16px; width: 100%; cursor: pointer; transition: all 0.3s;">Submit Enrollment</button>
                            </div>
                        </div>
                    </form>
                    <div id="successMessage" style="display: none; background: #28a745; color: #fff; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: center;">
                        <i class="fas fa-check-circle" style="font-size: 40px; margin-bottom: 10px;"></i>
                        <h4>Enrollment Submitted Successfully!</h4>
                        <p>We'll contact you soon.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script>
        // Quiz questions
        const quizQuestions = [
            {
                question: "What is your primary fitness goal?",
                options: ["Weight Loss", "Muscle Gain", "Improve Stamina", "Learn Self-Defense"]
            },
            {
                question: "How many days per week can you train?",
                options: ["2-3 days", "4-5 days", "6-7 days", "Flexible schedule"]
            },
            {
                question: "What is your current fitness level?",
                options: ["Beginner", "Intermediate", "Advanced", "Professional"]
            },
            {
                question: "Have you trained in martial arts before?",
                options: ["Never", "Less than 1 year", "1-3 years", "More than 3 years"]
            },
            {
                question: "What time do you prefer to train?",
                options: ["Morning (6-10 AM)", "Afternoon (12-4 PM)", "Evening (5-9 PM)", "Night (9-11 PM)"]
            }
        ];

        // Select random question
        const randomQuestion = quizQuestions[Math.floor(Math.random() * quizQuestions.length)];
        document.querySelector('#quizQuestion p').textContent = randomQuestion.question;
        
        const optionsHtml = randomQuestion.options.map((option, index) => 
            `<label style="display: block; margin-bottom: 10px; cursor: pointer;">
                <input type="radio" name="quizAnswer" value="${option}" required style="margin-right: 10px;">
                <span style="color: #d0d0d0;">${option}</span>
            </label>`
        ).join('');
        document.getElementById('quizOptions').innerHTML = optionsHtml;

        // Form submission
        document.getElementById('enrollmentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                name: formData.get('name'),
                phone: formData.get('phone'),
                email: formData.get('email') || 'Not provided',
                course: formData.get('course'),
                quizQuestion: randomQuestion.question,
                quizAnswer: formData.get('quizAnswer')
            };

            // Send email using mailto (opens email client)
            const subject = encodeURIComponent('New Enrollment: ' + data.name);
            const body = encodeURIComponent(
                `New Enrollment Request\n\n` +
                `Name: ${data.name}\n` +
                `Phone: ${data.phone}\n` +
                `Email: ${data.email}\n` +
                `Course: ${data.course}\n\n` +
                `Quiz Question: ${data.quizQuestion}\n` +
                `Answer: ${data.quizAnswer}`
            );
            
            window.location.href = `mailto:prowarriormma@gmail.com?subject=${subject}&body=${body}`;
            
            // Show success message
            document.getElementById('enrollmentForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
        });
    </script>
